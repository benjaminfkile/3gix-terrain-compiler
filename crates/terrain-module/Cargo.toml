[package]
name = "terrain-module"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The terrain module: builds one frame's whole matter from the elevation tile pyramid and a radial interior profile."

[lib]
name = "terrain_module"
path = "src/lib.rs"
# `cdylib` is the WebAssembly module; `rlib` is what the CLI and the tests
# link.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "terrain-module"
path = "src/main.rs"

[dependencies]
terrain-tiles = { path = "../terrain-tiles" }
gx-core = { workspace = true }
gx-module-guest = { workspace = true }
